<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHIRITORI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="contact-list" id="contactList">
    <div class="contact-list-header">
      <div class="app-title">しりとり道場</div>
      <button class="restart-all" id="restartAllBtn">はじめから</button>
    </div>
    <div class="contacts" id="contacts"></div>
  </aside>

  <div class="content">
    <header>
      <button class="back-btn" id="backBtn" aria-label="トーク一覧に戻る">‹</button>
      <div class="chat-bar">
        <div class="medallion" id="medallion">―</div>
        <div class="chat-info">
          <div class="chat-name" id="chatName">辞書番</div>
          <div class="medallion-label" id="medallionLabel">最初のことばへ</div>
        </div>
      </div>
    </header>

    <main id="chain">
      <div class="empty-hint" id="emptyHint">
        <div class="kanban-mini">— 対局開始 —</div>
        ひらがな・カタカナで、ことばを入力してください。<br>
        読みが「ん」で終わったら、その場で負けです。
      </div>
    </main>

    <div class="input-bar">
      <div class="timer-row">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-label" id="timerLabel">60秒</div>
      </div>
      <div class="input-row">
        <input id="wordInput" type="text" placeholder="ことばを入力…" autocomplete="off" disabled>
        <button id="submitBtn" disabled>送る</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
