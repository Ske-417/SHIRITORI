<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHIRITORI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="chat-bar">
      <div class="medallion" id="medallion">―</div>
      <div class="chat-info">
        <div class="chat-name">辞書番</div>
        <div class="medallion-label" id="medallionLabel">最初のことばへ</div>
      </div>
    </div>

    <div class="settings-row">
      強さ：
      <select id="strengthSelect">
        <option value="easy">やさしめ</option>
        <option value="normal">ふつう</option>
        <option value="hard" selected>めちゃ強い</option>
      </select>
      <label class="timer-toggle"><input type="checkbox" id="timerToggle" checked>持ち時間</label>
      <button class="restart" id="restartBtn">はじめから</button>
    </div>
  </header>

  <div class="content">
    <main id="chain">
      <div class="empty-hint" id="emptyHint">
        <div class="kanban-mini">— 対局開始 —</div>
        ひらがな・カタカナで、ことばを入力してください。<br>
        読みが「ん」で終わったら、その場で負けです。
      </div>
    </main>

    <div class="input-bar">
      <div class="timer-row">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-label" id="timerLabel">60秒</div>
      </div>
      <div class="input-row">
        <input id="wordInput" type="text" placeholder="ことばを入力…" autocomplete="off" disabled>
        <button id="submitBtn" disabled>送る</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
